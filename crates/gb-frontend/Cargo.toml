[package]
name = "gb-frontend"
description = "Desktop frontend (window, input, audio) for the gb emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92" # rfd 0.18 needs 1.92 (pixels 0.17 / wgpu 29 need 1.88); workspace MSRV stays 1.85 for gb-core

[[bin]]
name = "gb"
path = "src/main.rs"

[dependencies]
emu-common.workspace = true
gb-core.workspace = true
gba-core.workspace = true
winit.workspace = true
pixels.workspace = true
cpal.workspace = true
ctrlc.workspace = true
directories.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
png = "0.18"
# Native file-open dialog. On Linux the xdg-portal backend: no GTK build dependency
# (libdbus is loaded at run time, with zenity as the fallback).
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
# The in-app UI (library, pause menu, help), drawn into the pixels window. egui-wgpu 0.35 is
# built on wgpu 29, the version pixels 0.17 uses, so both share one device; egui-winit 0.35
# takes winit 0.30. No clipboard, link or accessibility backends: the UI has no text input.
egui = { version = "=0.35.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.35.0", default-features = false }
egui-winit = { version = "=0.35.0", default-features = false, features = ["x11", "wayland"] }
# Opens the data folder in the file manager (Finder, Explorer, xdg-open).
opener = { version = "=0.9.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true
gb-test = { path = "../gb-test" }

# Installers: `cargo packager --release` (cargo-packager, run by .github/workflows/release.yml).
# Keys are camelCase because cargo-packager reads this table as JSON. The version comes from
# the workspace and the `gb` binary is found from the package, so neither is repeated here.
# cargo-packager runs from this crate's directory, hence the ../../ in the icon paths.
# No `macos` or `windows` table is set: the release workflow appends one when signing
# secrets exist.
[package.metadata.packager]
productName = "gameboyem"
identifier = "app.gameboyem"
description = "Game Boy, Game Boy Color and Game Boy Advance emulator"
homepage = "https://github.com/jacob187/gameboyem"
publisher = "gameboyem"
category = "Game"
# The packager builds the .icns for macOS from these and installs them into the hicolor theme
# on Linux; 1024 px is left out because it has no .icns type at density 1 and would make
# hicolor an odd 1024x1024@2 directory.
icons = [
  "../../assets/icon/32x32.png",
  "../../assets/icon/128x128.png",
  "../../assets/icon/256x256.png",
  "../../assets/icon/512x512.png",
]

# The bundled homebrew games. CI downloads the five ROMs and LICENSE.txt into <repo>/games
# (gitignored) before packaging; if the folder is missing the packager bundles nothing and
# says nothing, so release.yml checks it first. The target puts the files in a `games` folder
# inside the packager's resources folder: macOS Contents/Resources/games; Windows (NSIS)
# games next to gb.exe; Linux .deb and AppImage usr/lib/gb/games (the packager uses
# usr/lib/<binary name>). bundled.rs finds them at run time. The portable zip and .tar.gz are
# not made by the packager; release.yml puts `games` beside the binary.
resources = [{ src = "../../games", target = "games" }]

# macOS: CFBundleDocumentTypes ("Open With"; Finder passes the file as an Apple event, which
# `gb` does not handle, so it starts and asks with the dialog). Windows: the installer
# registers the extensions and passes the path as an argument. Linux: MimeType in the .desktop
# file, and the file is passed as an argument (Exec=gb %F).
[[package.metadata.packager.fileAssociations]]
extensions = ["gb"]
name = "Game Boy ROM"
description = "Game Boy ROM"
mimeType = "application/x-gameboy-rom"
role = "viewer"

[[package.metadata.packager.fileAssociations]]
extensions = ["gbc"]
name = "Game Boy Color ROM"
description = "Game Boy Color ROM"
mimeType = "application/x-gameboy-color-rom"
role = "viewer"

[[package.metadata.packager.fileAssociations]]
extensions = ["gba"]
name = "Game Boy Advance ROM"
description = "Game Boy Advance ROM"
mimeType = "application/x-gba-rom"
role = "viewer"

# libasound is linked at build time (Ubuntu 24.04 renamed it to libasound2t64). rfd's
# file dialog needs a desktop portal or zenity at run time.
[package.metadata.packager.deb]
depends = ["libasound2 | libasound2t64", "libudev1", "xdg-desktop-portal | zenity"]
