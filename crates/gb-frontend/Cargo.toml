[package]
name = "gb-frontend"
description = "Desktop frontend (window, input, audio) for the gb emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88" # pixels 0.17 (wgpu 29) needs 1.88; workspace MSRV stays 1.85 for gb-core

[[bin]]
name = "gb"
path = "src/main.rs"

[dependencies]
emu-common.workspace = true
gb-core.workspace = true
winit.workspace = true
pixels.workspace = true
cpal.workspace = true
ctrlc.workspace = true
png = "0.18"

[dev-dependencies]
tempfile.workspace = true
