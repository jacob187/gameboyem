name: Release

# A pushed tag `v*` builds the installers on every platform and publishes them, with a
# SHA256SUMS file, as a GitHub Release. A manual run (Actions > Release > Run workflow)
# builds the same packages and keeps them as workflow artifacts only: nothing is released.
#
# The five homebrew games (homebrew/) are built once, in the `games` job, and every package
# job puts them in a `games/` folder that the packager installs as app resources.
#
# The packages are unsigned. The optional signing steps below turn on by themselves when
# the matching repository secrets exist; see "Optional signing" in each job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Installed with `cargo install`; bump deliberately.
  CARGO_PACKAGER_VERSION: "0.11.8"

permissions:
  contents: read

jobs:
  # The bundled games: Snake, Breakout and cgbdemo (GBDK-2020), GRAINS and MOTH (agb on a
  # pinned nightly). The steps and pinned versions are copied from the test job in ci.yml:
  # keep these pins in sync with ci.yml. The ROMs leave as the `bundled-games` artifact.
  # (Not named gameboyem-*: the publish job collects that pattern as release files.)
  games:
    name: bundled games
    runs-on: ubuntu-latest
    env:
      GBDK_VERSION: "4.5.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache GBDK
        uses: actions/cache@v4
        with:
          path: tools/gbdk
          key: gbdk-${{ env.GBDK_VERSION }}-gbdk-linux64.tar.gz

      - name: Build homebrew ROMs (GBDK-2020)
        run: |
          if [ ! -x tools/gbdk/bin/lcc ]; then
            mkdir -p tools
            curl -fsSL "https://github.com/gbdk-2020/gbdk-2020/releases/download/${GBDK_VERSION}/gbdk-linux64.tar.gz" | tar -xz -C tools
          fi
          make -C homebrew GBDK_HOME="$PWD/tools/gbdk/"

      - name: Cache the GBA homebrew nightly
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/nightly-2026-07-22-*
            ~/.rustup/update-hashes/nightly-2026-07-22-*
          key: gba-nightly-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('homebrew/gba/rust-toolchain.toml') }}

      - name: Install the GBA homebrew nightly
        run: rustup toolchain install nightly-2026-07-22 --component rust-src,clippy,rustfmt --profile minimal

      - name: Cache the GBA homebrew build
        uses: actions/cache@v4
        with:
          path: homebrew/gba/target
          key: gba-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('homebrew/gba/rust-toolchain.toml', 'homebrew/gba/Cargo.lock') }}

      - name: Cache agb-gbafix
        uses: actions/cache@v4
        with:
          path: tools/agb
          key: agb-gbafix-0.25.0-${{ runner.os }}

      - name: Build GBA homebrew ROMs (agb)
        run: |
          if [ ! -x tools/agb/bin/agb-gbafix ]; then
            cargo install agb-gbafix --version 0.25.0 --locked --root tools/agb
          fi
          make -C homebrew gba

      # games/ is what the packager installs: the five ROMs and the licence note.
      - name: Collect the games
        run: |
          mkdir games
          cp roms/homebrew/*.gb roms/homebrew/*.gba games/
          cp homebrew/LICENSE.txt games/LICENSE.txt
          ls -l games
          count=$(ls games/*.gb games/*.gba | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 homebrew ROMs, found $count"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-games
          path: games/*
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.name }}
    needs: games
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and macos-13 are retired. macos-15 is arm64; macos-15-intel is the
          # last Intel image GitHub offers, so the x86_64 build runs natively on it.
          - name: macos-arm64
            os: macos-15
            formats: dmg
          - name: macos-x86_64
            os: macos-15-intel
            formats: dmg
          - name: windows-x64
            os: windows-latest
            formats: nsis
          # The oldest image on offer, for the oldest glibc (2.35): the AppImage and the
          # binary then run on any distribution at least that new. If GitHub retires
          # ubuntu-22.04, move to ubuntu-24.04 and install libfuse2t64 instead of libfuse2.
          - name: linux-x86_64
            os: ubuntu-22.04
            formats: appimage,deb
    defaults:
      run:
        shell: bash
    env:
      # GitHub does not allow the `secrets` context in a step's `if:`, so each optional
      # step is gated on one of these job-level flags instead. They hold only
      # 'true' or 'false', never a secret's value.
      HAVE_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAVE_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      # The same packages ci.yml installs, plus FUSE for the AppImage tooling.
      - name: Install Linux system dependencies (X11, Wayland, ALSA, udev, FUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The packager installs this folder as app resources (see
      # [package.metadata.packager] resources in crates/gb-frontend/Cargo.toml).
      - name: Download the bundled games
        uses: actions/download-artifact@v4
        with:
          name: bundled-games
          path: games

      - name: Check the bundled games
        run: |
          ls -l games
          count=$(ls games/*.gb games/*.gba | wc -l)
          if [ "$count" -ne 5 ] || [ ! -f games/LICENSE.txt ]; then
            echo "::error::games/ must hold 5 ROMs and LICENSE.txt"
            exit 1
          fi

      - name: Resolve the version
        run: |
          version=$(cargo pkgid -p gb-frontend | sed 's/.*[#@]//')
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the tag matches the crate version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $VERSION; bump [workspace.package] version in Cargo.toml first"
            exit 1
          fi

      - name: Build (release profile)
        run: cargo build --release --locked -p gb-frontend

      - name: Cache cargo-packager
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: cargo-packager-${{ env.CARGO_PACKAGER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        run: |
          if ! command -v cargo-packager >/dev/null; then
            cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          fi

      # ---- Optional signing (untested: no certificates exist yet) --------------------
      # Each step runs only when its secrets are set. Without them the build is unsigned.
      #
      # macOS needs the repository secrets APPLE_CERTIFICATE (base64 of a Developer ID
      # Application .p12), APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY
      # ("Developer ID Application: Name (TEAMID)"). To notarize as well, add APPLE_ID,
      # APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID. The packager signs
      # the .app and notarizes it when it finds all of them; it takes the signing
      # identity from its config, so this step adds it there.
      - name: Enable macOS code signing (optional)
        if: runner.os == 'macOS' && env.HAVE_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          printf '\n[package.metadata.packager.macos]\nsigningIdentity = "%s"\n' "$APPLE_SIGNING_IDENTITY" >> crates/gb-frontend/Cargo.toml

      # Windows needs WINDOWS_CERTIFICATE (base64 of a code-signing .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD. The certificate is imported into the user's store
      # and the packager signs gb.exe, the uninstaller and the installer with signtool.
      - name: Enable Windows code signing (optional)
        if: runner.os == 'Windows' && env.HAVE_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          Add-Content crates/gb-frontend/Cargo.toml @"

          [package.metadata.packager.windows]
          certificateThumbprint = "$($cert.Thumbprint)"
          digestAlgorithm = "sha256"
          timestampUrl = "http://timestamp.digicert.com"
          "@

      - name: Package
        env:
          # Read by the packager only when macOS signing is enabled above; ignored otherwise.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The AppImage tools are AppImages themselves: run them without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          mkdir dist
          cargo packager --release -p gb-frontend --formats "${{ matrix.formats }}" -o dist -v
          ls -l dist

      # Descriptive file names: gameboyem-<version>-<os>-<arch>.<ext>.
      - name: Collect release files
        run: |
          mkdir release
          stem="gameboyem-$VERSION-${{ matrix.name }}"
          case "$RUNNER_OS" in
            macOS)
              cp dist/*.dmg "release/$stem.dmg"
              ;;
            Windows)
              cp dist/*-setup.exe "release/$stem-setup.exe"
              pwsh -NoProfile -Command "Compress-Archive -Path target/release/gb.exe, games -DestinationPath release/$stem-portable.zip"
              ;;
            Linux)
              cp dist/*.AppImage "release/$stem.AppImage"
              chmod +x "release/$stem.AppImage"
              cp dist/*.deb "release/$stem.deb"
              mkdir "$stem"
              cp target/release/gb "$stem/"
              cp -r games "$stem/"
              tar -czf "release/$stem.tar.gz" "$stem"
              ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: gameboyem-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # Only for a pushed tag. A manual run stops after `build` and leaves the artifacts, even
  # when it was started from a tag, hence the event check.
  release:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gameboyem-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
